<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft AI</title>
    <style>
        body { font-family: sans-serif; background: #dbeafe; text-align: center; padding: 20px; }
        .box { background: white; max-width: 700px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        textarea { width: 90%; height: 80px; border-radius: 10px; padding: 10px; border: 2px solid #3b82f6; }
        button { background: #2563eb; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .comic { margin-top: 20px; text-align: left; }
        .panel { background: #eff6ff; border-left: 5px solid #2563eb; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .panel h3 { margin: 0 0 5px 0; color: #1e40af; }
    </style>
</head>
<body>
    <div class="box">
        <h1>💙 ComicCraft AI</h1>
        <p>Ungal story-a type pannunga da!</p>
        <textarea id="prompt" placeholder="Ex: A cute cat becomes a superhero in Chennai"></textarea><br>
        <button onclick="generate()">✨ Generate Comic</button>
        <div id="result" class="comic"></div>
    </div>

<script>
async function generate(){
    const prompt = document.getElementById('prompt').value;
    const resDiv = document.getElementById('result');
    resDiv.innerHTML = "Generating... ⏳";
    
    const res = await fetch('/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt})
    });
    const data = await res.json();
    
    let html = `<h2>${data.title || 'Your Comic'}</h2>`;
    if(data.panels){
        data.panels.forEach(p => {
            html += `<div class="panel"><h3>Panel ${p.id}</h3><p>${p.text}</p><small>🎨 Image: ${p.image_prompt}</small></div>`;
        });
    } else {
        html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }
    resDiv.innerHTML = html;
}
</script>
</body>
</html>
